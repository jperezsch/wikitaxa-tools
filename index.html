<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Wikitaxa - Jorge Pérez-Schultheiss</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7f9; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
        h2 { color: #004a99; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-top: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .full { grid-column: span 2; }
        label { font-weight: 600; display: block; margin-bottom: 8px; font-size: 14px; color: #555; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccd0d4; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        input:focus, textarea:focus { border-color: #004a99; outline: none; box-shadow: 0 0 0 2px rgba(0,74,153,0.1); }
        textarea { height: 100px; font-family: inherit; resize: vertical; }
        .btn-group { margin-top: 30px; display: flex; gap: 15px; justify-content: center; }
        button { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; transition: 0.2s; }
        .btn-main { background: #004a99; color: white; }
        .btn-main:hover { background: #003366; }
        .btn-dl { background: #28a745; color: white; }
        .btn-dl:hover { background: #218838; }
        #preview { margin-top: 30px; background: #272822; color: #f8f8f2; padding: 20px; border-radius: 8px; font-family: "Courier New", Courier, monospace; font-size: 13px; white-space: pre-wrap; display: none; overflow-x: auto; border: 1px solid #3e3e3e; }
    </style>
</head>
<body>

<div class="container">
    <h2>Generador de Fichas Wikitaxa</h2>
    <p style="font-size: 0.85em; color: #666; margin-bottom: 20px;">Complete los campos para generar el código Wikidot. Los niveles taxonómicos se formatearán automáticamente con enlaces.</p>
    
    <div class="grid">
        <div class="full">
            <label>Clasificación (Separar niveles con ":" )</label>
            <input type="text" id="taxa" placeholder="Ej: Animalia: Arthropoda: Malacostraca: Isopoda: Sphaeromatidea: Sphaeromatidae: Isocladus">
        </div>

        <div>
            <label>URL Imagen 1 (Macho Joven / Vista Principal)</label>
            <input type="text" id="img1" placeholder="https://live.staticflickr.com/...">
            <label style="margin-top:15px;">Epígrafe Figura 1</label>
            <textarea id="pie1" placeholder="//Especie// Autor, Año: descripción..."></textarea>
        </div>

        <div>
            <label>URL Imagen 2 (Macho Adulto / Figura Original)</label>
            <input type="text" id="img2" placeholder="https://live.staticflickr.com/...">
            <label style="margin-top:15px;">Epígrafe Figura 2</label>
            <textarea id="pie2" placeholder="//Especie// Autor, Año: descripción..."></textarea>
        </div>

        <div class="full">
            <label>Determinación (Texto técnico comparativo)</label>
            <textarea id="det" style="height:150px;" placeholder="Describa los caracteres diagnósticos aquí..."></textarea>
        </div>

        <div class="full">
            <label>Distribución</label>
            <textarea id="dist" placeholder="Localidades, coordenadas o rangos latitudinales..."></textarea>
        </div>

        <div class="full">
            <label>Referencias Recomendadas (Use * para cada una)</label>
            <textarea id="refs" placeholder="* Autor, A. (Año) Título de la publicación..."></textarea>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-main" onclick="updatePreview()">Vista Previa del Código</button>
        <button class="btn-dl" onclick="downloadTxt()">Descargar Ficha (.txt)</button>
    </div>

    <div id="preview"></div>
</div>

<script>
function buildWikidotCode() {
    const taxaInput = document.getElementById('taxa').value;
    const taxaFmt = taxaInput.split(':').map(t => `[[[${t.trim()}]]]`).join(': ');
    
    const img1 = document.getElementById('img1').value;
    const pie1 = document.getElementById('pie1').value;
    const img2 = document.getElementById('img2').value;
    const pie2 = document.getElementById('pie2').value;
    const det = document.getElementById('det').value;
    const dist = document.getElementById('dist').value;
    const refs = document.getElementById('refs').value;

    return `**Jorge Pérez-Schultheiss**
//Área Zoología de Invertebrados, Museo Nacional de Historia Natural, Chile.//
------

++ Clasificación:
${taxaFmt}

------

[[table style="width: 100%; margin: 0; padding: 0; border-collapse: collapse;"]]
[[row]]
[[cell style="width: 50%; padding: 5px; vertical-align: top;"]]
[[image ${img1} width="100%" alt="Imagen 1" link="*${img1}"]]
**Figura 1:** ${pie1}
[[/cell]]
[[cell style="width: 50%; padding: 5px; vertical-align: top;"]]
[[div style="margin: 0 auto; width: 60%; text-align: center;"]]
[[image ${img2} width="103%" alt="Imagen 2" link="*${img2}"]]
[[/div]]
**Figura 2:** ${pie2}
[[/cell]]
[[/row]]
[[/table]]

------

++ Determinación: 
${det}

------

++ Distribución: 
${dist}

------

++ Referencias recomendadas: 
${refs}`;
}

function updatePreview() {
    const pre = document.getElementById('preview');
    pre.innerText = buildWikidotCode();
    pre.style.display = 'block';
    pre.scrollIntoView({ behavior: 'smooth' });
}

function downloadTxt() {
    const code = buildWikidotCode();
    const blob = new Blob([code], { type: 'text/plain' });
    const a = document.createElement('a');
    const taxaInput = document.getElementById('taxa').value.split(':').pop().trim() || "nueva_ficha";
    a.href = URL.createObjectURL(blob);
    a.download = `ficha_${taxaInput.toLowerCase()}.txt`;
    a.click();
}
</script>

</body>
</html>
